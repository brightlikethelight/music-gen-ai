name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  CACHE_VERSION: 2

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local
        key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[lint]
        pip install build

    - name: Code formatting check (Black)
      run: black --check --line-length=100 src tests

    - name: Import sorting check (isort)
      run: isort --check-only --profile black src tests

    - name: Linting (flake8)
      run: flake8 src tests --max-line-length=100 --extend-ignore=E203,W503,E722,E712,F811,W293,W605,E402,E501 --per-file-ignores=__init__.py:F401

    - name: Type checking (mypy)
      run: mypy src --ignore-missing-imports --python-version=3.11

    - name: Test package build
      run: |
        python -m build
        pip install dist/*.whl
        python -c "from musicgen import MusicGenerator; print('Package OK')"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.local
        key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-

    - name: Cache ML models
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          ~/.cache/torch
          ~/musicgen_models
        key: ${{ runner.os }}-models-${{ env.CACHE_VERSION }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-models-${{ env.CACHE_VERSION }}-
          ${{ runner.os }}-models-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[test]

    - name: Run unit tests
      env:
        JWT_SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        MUSICGEN_SKIP_MODEL_DOWNLOAD: "1"
        PYTEST_CURRENT_TEST: "1"
        TOKEN_BLACKLIST_FAIL_POLICY: open
        NO_COLOR: "1"
      run: |
        pytest tests/unit/ \
          --cov=src/musicgen \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=75 \
          -v --tb=short

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[test]

    - name: Run integration tests
      env:
        JWT_SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        MUSICGEN_SKIP_MODEL_DOWNLOAD: "1"
        PYTEST_CURRENT_TEST: "1"
        TOKEN_BLACKLIST_FAIL_POLICY: open
        NO_COLOR: "1"
      run: |
        pytest tests/integration/ \
          -v --tb=short \
          --timeout=300

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[test]

    - name: Run performance benchmarks
      continue-on-error: true
      env:
        JWT_SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        MUSICGEN_SKIP_MODEL_DOWNLOAD: "1"
        PYTEST_CURRENT_TEST: "1"
        TOKEN_BLACKLIST_FAIL_POLICY: open
        NO_COLOR: "1"
      run: |
        pytest tests/ -m "not slow" \
          --benchmark-only \
          --benchmark-json=benchmark.json

    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      if: github.ref == 'refs/heads/main' && hashFiles('benchmark.json') != ''
      continue-on-error: true
      with:
        tool: 'pytest'
        output-file-path: benchmark.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security scanning tools
      run: |
        python -m pip install --upgrade pip
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -e .
        pip install bandit==1.7.10 "safety>=2.3.0,<3.0.0"

    - name: Run safety check
      continue-on-error: true
      run: |
        # Check for known vulnerabilities in dependencies
        safety check --json --output safety-report.json || {
          echo "::warning::Vulnerabilities found in dependencies - review safety-report.json"
          cat safety-report.json
        }

    - name: Run bandit security scan
      run: |
        # Security scan with threshold enforcement (aligned with pre-commit)
        bandit -r src -f json -o bandit-report.json --severity-level medium --confidence-level medium
        # Check for high severity issues (blocking)
        python -c "
        import json
        import sys
        with open('bandit-report.json') as f:
            data = json.load(f)
        results = data.get('results', [])
        high_sev = sum(1 for r in results if r.get('issue_severity') == 'HIGH')
        if high_sev > 0:
            print(f'::error::Found {high_sev} HIGH severity security issues')
            for r in results:
                if r.get('issue_severity') == 'HIGH':
                    print(f\"  - {r.get('filename')}:{r.get('line_number')}: {r.get('issue_text')}\")
            sys.exit(1)
        med_sev = sum(1 for r in results if r.get('issue_severity') == 'MEDIUM')
        print(f'Security scan passed: {high_sev} high, {med_sev} medium severity issues')
        "

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-tests, security-scan, performance-tests]
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ] ||
             [ "${{ needs.unit-tests.result }}" != "success" ] ||
             [ "${{ needs.integration-tests.result }}" != "success" ] ||
             [ "${{ needs.security-scan.result }}" != "success" ] ||
             [ "${{ needs.performance-tests.result }}" != "success" ]; then
            echo "One or more required jobs failed:"
            echo "  code-quality: ${{ needs.code-quality.result }}"
            echo "  unit-tests: ${{ needs.unit-tests.result }}"
            echo "  integration-tests: ${{ needs.integration-tests.result }}"
            echo "  security-scan: ${{ needs.security-scan.result }}"
            echo "  performance-tests: ${{ needs.performance-tests.result }}"
            exit 1
          fi
          echo "All required checks passed"
