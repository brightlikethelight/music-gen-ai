name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  CACHE_VERSION: 1
  POETRY_VERSION: "1.7.1"

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pypoetry
          ~/.local
        key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('pyproject.toml', 'poetry.lock', 'requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Code formatting check (Black)
      run: black --check --line-length=100 src tests
      
    - name: Import sorting check (isort)
      run: isort --check-only --profile black src tests
      
    - name: Linting (flake8)
      run: flake8 src tests --max-line-length=100 --extend-ignore=E203,W503,F401,F841,E722,E712,F811,W293,W605,E402,F541,E501,F403,F405
      
    - name: Type checking (mypy)
      run: mypy src --ignore-missing-imports --no-strict-optional || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
        # Note: Python 3.9 removed (project requires >=3.10), 3.12 excluded (ML ecosystem incompatibility)
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pypoetry
          ~/.local
        key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'poetry.lock', 'requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-
          
    - name: Cache ML models
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          ~/.cache/torch
          ~/musicgen_models
        key: ${{ runner.os }}-models-${{ env.CACHE_VERSION }}-${{ hashFiles('src/musicgen/core/generator.py') }}
        restore-keys: |
          ${{ runner.os }}-models-${{ env.CACHE_VERSION }}-
          ${{ runner.os }}-models-
          
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install project with dev dependencies
        pip install -e .[dev]
        # Install minimal ML dependencies for testing (CPU only for CI)
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        
    - name: Run unit tests
      env:
        JWT_SECRET_KEY: test-secret-key-for-ci
        MUSICGEN_SKIP_MODEL_DOWNLOAD: "1"
        PYTEST_CURRENT_TEST: "1"
      run: |
        pytest tests/unit/ \
          --cov=src/musicgen \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=25 \
          --ignore=tests/unit/test_generator.py \
          --ignore=tests/unit/test_hybrid_app_simple.py \
          --ignore=tests/unit/test_memory_management.py \
          --ignore=tests/unit/test_cli.py \
          --ignore=tests/unit/test_api.py \
          --ignore=tests/unit/test_logging.py \
          --ignore=tests/unit/test_prompt.py \
          --ignore=tests/unit/services/test_batch.py \
          -v --tb=short
          
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

    - name: Run integration tests
      env:
        JWT_SECRET_KEY: test-secret-key-for-ci
        MUSICGEN_SKIP_MODEL_DOWNLOAD: "1"
        PYTEST_CURRENT_TEST: "1"
      run: |
        pytest tests/integration/ \
          -v --tb=short \
          --timeout=300
      continue-on-error: true  # Integration tests may fail without full model setup
          
    - name: Run API tests
      run: |
        pytest tests/integration/test_api.py \
          -v --tb=short
      continue-on-error: true  # Allow API tests to fail initially

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        
    - name: Run performance benchmarks
      env:
        JWT_SECRET_KEY: test-secret-key-for-ci
        MUSICGEN_SKIP_MODEL_DOWNLOAD: "1"
        PYTEST_CURRENT_TEST: "1"
      run: |
        pip install pytest-benchmark || true
        pytest tests/ -m "not slow" \
          --benchmark-only \
          --benchmark-json=benchmark.json || true
      continue-on-error: true
          
    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      if: github.ref == 'refs/heads/main'
      with:
        tool: 'pytest'
        output-file-path: benchmark.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true

