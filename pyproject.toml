[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicgen-unified"
version = "2.0.1"
description = "Academic research project exploring AI music generation - Harvard CS 109B experimental implementation (NOT production-ready)"
authors = [
    {name = "Bright Liu", email = "brightliu@college.harvard.edu"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Education",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
]
keywords = [
    "music", "generation", "ai", "machine-learning", "deep-learning",
    "pytorch", "transformers", "audio", "musicgen", "harvard", "cs109b",
    "academic", "experimental", "educational", "research", "prototype"
]
dependencies = [
    # Numerical computing
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.14.0,<2.0.0",

    # Machine Learning
    "torch>=2.2.0,<3.0.0",
    "torchaudio>=2.2.0,<3.0.0",
    "transformers>=4.43.0,<5.0.0",

    # Audio processing
    "soundfile>=0.12.0,<1.0.0",
    "pydub>=0.25.0,<1.0.0",

    # Data handling
    "pandas>=2.0.0,<3.0.0",

    # CLI and UI
    "typer[all]>=0.9.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",

    # API framework
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.6,<1.0.0",

    # Authentication and Security
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "bcrypt>=4.0.0,<5.0.0",
    "redis>=4.5.0,<7.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "coverage>=7.0.0",
    "httpx>=0.25.0",
]
lint = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "types-redis>=4.5.0",
]
security = [
    "safety>=2.3.0,<3.0.0",
    "bandit==1.7.10",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.22.0",
]
viz = [
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.0.0",
    "tensorboard>=2.13.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]
debug = [
    "ipdb>=0.13.0",
    "pudb>=2022.0.0",
    "memory-profiler>=0.60.0",
    "line-profiler>=4.0.0",
    "pre-commit>=3.0.0",
]
dev = [
    "musicgen-unified[test,lint,security,docs,viz,notebook,debug]",
]
deployment = [
    "prometheus-client>=0.17.0",
    "structlog>=23.0.0",
]

[project.scripts]
musicgen = "musicgen.cli.main:app"

[project.urls]
Homepage = "https://github.com/brightlikethelight/music-gen-ai"
Repository = "https://github.com/brightlikethelight/music-gen-ai"
Issues = "https://github.com/brightlikethelight/music-gen-ai/issues"
Documentation = "https://github.com/brightlikethelight/music-gen-ai/tree/main/docs"
"CS 109B Project" = "https://github.com/brightlikethelight/music-gen-ai/tree/main/docs/cs109b"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musicgen = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--timeout=300",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (moderate speed)",
    "slow: Slow tests (>30s, may require GPU)",
    "gpu: Tests requiring GPU hardware",
    "asyncio: Asynchronous tests",
    "auth: Authentication and authorization tests",
    "cli: Command line interface tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/musicgen"]
data_file = ".coverage"
parallel = true
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
